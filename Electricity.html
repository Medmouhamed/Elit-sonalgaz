<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Electricity - Sonelgaz</title>
  <link rel="stylesheet" href="Electricity.css" />
</head>
<body>
  <header>
    <h1>Electricity</h1>
    <p>Key figures for electricity in Algeria</p>
  </header>

  <section class="img-info">
    <div class="img-side">
      <img src="img/map el.jpg" alt="">
    </div>
    <div class="info-side">
      <div class="stat-card">
        <h2>99%</h2>
        <p>Electrification rate</p>
      </div>
      <div class="stat-card">
        <h2>26 017,20 MW</h2>
        <p>Installed capacity</p>
      </div>
      <div class="stat-card">
        <h2>35 537 km</h2>
        <p>Transport Network</p>
      </div>
      <div class="stat-card">
        <h2>416 516 km</h2>
        <p>Distribution Network</p>
      </div>
      <div class="stat-card">
        <h2>12 297 856</h2>
        <p>Number of customers</p>
      </div>
    </div>
  </section>

</body>
</html>
